server:
  port: 8080

spring:
  application:
    name: realtime-chatapp
  profiles:
    active: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # 256-bit base64 secret key
    secret: dGhpc0lzQVNlY3VyZUtleUZvclJlYWx0aW1lQ2hhdEFwcDIwMjZKV1RNYXN0ZXJLZXk=
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

---
# Optional H2 fallback profile for standalone testing without running MySQL server:
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:chatapp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
